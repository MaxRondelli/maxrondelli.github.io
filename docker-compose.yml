# Local development server with live reload.
#   docker compose up        -> http://localhost:8080 (rebuilds + reloads the browser on save)
#   docker compose up --build   after changing Gemfile / Gemfile.lock
#   docker compose down -v   to also drop the cached gems volume
services:
  jekyll:
    image: maxrondelli-site-dev # built locally from ./Dockerfile so gems match this Gemfile
    build: .
    command: /srv/jekyll/bin/entry_point.sh
    # uncomment these if you are having this issue with the build:
    # /usr/local/bundle/gems/jekyll-4.3.4/lib/jekyll/site.rb:509:in `initialize': Permission denied @ rb_sysopen - /srv/jekyll/.jekyll-cache/.gitignore (Errno::EACCES)
    # and fill the args values with the output of the commands on the right
    # build:
    #   args:
    #     GROUPID: # id -g
    #     GROUPNAME: # id -gn
    #     USERID: # id -u
    #     USERNAME: # echo $USER
    ports:
      - 8080:8080 # site
      - 35729:35729 # livereload
    volumes:
      - .:/srv/jekyll
      - bundle:/usr/local/bundle # keep installed gems across restarts
    environment:
      - JEKYLL_ENV=development

volumes:
  bundle:
